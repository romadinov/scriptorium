name: Reader
options:
  bundleIdPrefix: com.romadinov
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  ReaderCore:
    path: Packages/ReaderCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: SZVSSCJQFN   # Alexey Romadinov (Individual)

targets:
  Reader:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romadinov.reader
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Scriptorium
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        # Raise for every install (scripts/bump-build.sh): iCloud only re-reads NSUbiquitousContainers
        # (the "Scriptorium" folder in iCloud Drive) when the build number changes.
        CURRENT_PROJECT_VERSION: "17"
        CODE_SIGN_ENTITLEMENTS: App/Scriptorium.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Scriptorium
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Library folder is visible in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Local LLM servers (Ollama / LM Studio) are usually plain HTTP on the LAN.
        NSLocalNetworkUsageDescription: Connect to a language model running on your computer.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: DjVu Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [org.djvu.djvu]
          - CFBundleTypeName: EPUB Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: Web Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.webarchive]
          - CFBundleTypeName: Compiled HTML Help
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.microsoft.chm]
          - CFBundleTypeName: FictionBook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [org.gribuser.fb2]
          - CFBundleTypeName: Kindle Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.amazon.azw3]
          - CFBundleTypeName: Word Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.openxmlformats.wordprocessingml.document, com.microsoft.word.doc]
        # Highlights sync through iCloud Drive; the readable copies appear as iCloud Drive › Scriptorium.
        NSUbiquitousContainers:
          iCloud.com.romadinov.reader:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Scriptorium
            NSUbiquitousContainerSupportedFolderLevels: Any
        # scriptorium://open?doc=…&page=… links in the TaskPaper highlight/bookmark files open the app.
        CFBundleURLTypes:
          - CFBundleURLName: com.romadinov.reader.open
            CFBundleURLSchemes: [scriptorium]
        # Background import from the iCloud Inbox.
        UIBackgroundModes: [fetch, processing, audio]
        BGTaskSchedulerPermittedIdentifiers:
          - com.romadinov.reader.inbox.refresh
          - com.romadinov.reader.inbox.import
        # Wi-Fi Transfer advertises itself over Bonjour.
        NSBonjourServices: [_http._tcp]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.djvu.djvu
            UTTypeDescription: DjVu Document
            UTTypeConformsTo: [public.data, public.image]
            UTTypeTagSpecification:
              public.filename-extension: [djvu, djv]
              public.mime-type: [image/vnd.djvu, image/x-djvu]
          - UTTypeIdentifier: com.microsoft.chm
            UTTypeDescription: Compiled HTML Help
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [chm]
              public.mime-type: [application/vnd.ms-htmlhelp]
          - UTTypeIdentifier: org.gribuser.fb2
            UTTypeDescription: FictionBook
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fb2]
              public.mime-type: [application/x-fictionbook+xml]
          - UTTypeIdentifier: com.amazon.azw3
            UTTypeDescription: Kindle Book (AZW3)
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [azw3]
              public.mime-type: [application/vnd.amazon.mobi8-ebook]


  ScriptoriumMac:
    type: application
    platform: macOS
    scheme:
      testTargets: [ScriptoriumMacUITests]
    sources:
      - Mac
      - App/Shared
      - App/Settings/SettingsStore.swift
      - App/Library/LibraryStore.swift
      - App/Library/InboxAutomation.swift
      - App/Reader/ReaderModel.swift
      - App/Reader/ReadAloud.swift
      - App/Reader/AssistantPanel.swift
      - App/Reader/WordDocConverter.swift
      - App/Reader/ReflowableView.swift
      - App/Reader/Paginator.swift
      - App/Reader/PDFKitView.swift
      - path: App/Reader/ReflowEngine.js
        buildPhase: resources
    dependencies:
      - package: ReaderCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romadinov.reader.mac
        PRODUCT_NAME: Scriptorium
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "17"
        # scripts/test-mac.sh sets MAC_ENTITLEMENTS=ScriptoriumMac-Local (ad hoc signing, no iCloud).
        MAC_ENTITLEMENTS: ScriptoriumMac
        CODE_SIGN_ENTITLEMENTS: Mac/$(MAC_ENTITLEMENTS).entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Scriptorium
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.romadinov.reader.open
            CFBundleURLSchemes: [scriptorium]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Book
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, org.djvu.djvu, org.idpf.epub-container, com.apple.webarchive,
                                 com.microsoft.chm, org.gribuser.fb2, com.amazon.azw3,
                                 org.openxmlformats.wordprocessingml.document, com.microsoft.word.doc]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.djvu.djvu
            UTTypeDescription: DjVu Document
            UTTypeConformsTo: [public.data, public.image]
            UTTypeTagSpecification:
              public.filename-extension: [djvu, djv]
              public.mime-type: [image/vnd.djvu, image/x-djvu]
          - UTTypeIdentifier: com.microsoft.chm
            UTTypeDescription: Compiled HTML Help
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [chm]
          - UTTypeIdentifier: org.gribuser.fb2
            UTTypeDescription: FictionBook
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fb2]
          - UTTypeIdentifier: com.amazon.azw3
            UTTypeDescription: Kindle Book (AZW3)
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [azw3]
  ScriptoriumMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [MacUITests]
    dependencies:
      - target: ScriptoriumMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romadinov.reader.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  ReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Reader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romadinov.reader.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  Reader:
    build:
      targets:
        Reader: all
        ReaderUITests: [test]
    test:
      targets: [ReaderUITests]
